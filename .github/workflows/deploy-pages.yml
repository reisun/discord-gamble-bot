name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Quick Tunnel HTTPS base URL
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate runtime connection config
        env:
          QUICK_TUNNEL_URL: ${{ inputs.api_base_url || vars.QUICK_TUNNEL_URL }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const value = process.env.QUICK_TUNNEL_URL;
          const url = new URL(value);
          if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) {
            throw new Error('QUICK_TUNNEL_URL must be a valid HTTPS base URL');
          }
          mkdirSync('packages/web/public', { recursive: true });
          writeFileSync('packages/web/public/config.json', JSON.stringify({ apiBaseUrl: url.href.replace(/\/$/, '') }) + '\n');
          JS

      - name: Build web app
        run: npm run build -w packages/web
        env:
          VITE_BASE_PATH: /discord-gamble-bot/
          VITE_APP_VERSION: ${{ vars.APP_VERSION || '1.1.0' }}
          VITE_GIT_COMMIT: ${{ github.sha }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
